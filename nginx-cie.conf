# Sitio de Informática Empresarial (Consejo de Carrera Intersedes, UCR)
server {
    listen 80;
    server_name DOMINIO-POR-DEFINIR.ucr.ac.cr;
    root /var/www/cie;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Caché larga para recursos estáticos; HTML siempre fresco
    location ~* \.(css|js|woff2|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
