# Sitio de Informática Empresarial (Consejo de Carrera Intersedes, UCR)
# Refleja la configuración real del servidor (HTTPS con Certbot) más el endurecimiento
# revisado contra OWASP Top 10 2025. Se instala con: sudo bash /opt/cie-web/servidor/endurecer.sh
#
# Nota: las líneas "managed by Certbot" requieren que el certificado ya exista.
# En un servidor nuevo, instale primero sin ellas y ejecute certbot --nginx.

server {
    server_name informaticaempresarial.ucr.ac.cr;
    root /var/www/cie;
    index index.html;
    charset utf-8;

    # A02: no anunciar la versión de nginx
    server_tokens off;

    error_page 404 /404.html;

    # Cabeceras de seguridad a nivel de servidor. Ningún location usa add_header,
    # así que todas las respuestas (HTML, imágenes, CSS, JS, PDF) las heredan.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Caché larga para recursos estáticos (CSS y JS llevan ?v= de versión); HTML siempre fresco.
    # Se usa "expires" (no add_header) para no anular las cabeceras de seguridad.
    location ~* \.(css|js|woff2|png|svg|webp|ico|pdf)$ {
        expires 30d;
    }
    location ~* \.html$ {
        expires -1;
    }

    # A01: no servir archivos ocultos (.git, etc.)
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/manifest+json;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/informaticaempresarial.ucr.ac.cr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/informaticaempresarial.ucr.ac.cr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = informaticaempresarial.ucr.ac.cr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name informaticaempresarial.ucr.ac.cr;
    server_tokens off;
    return 404; # managed by Certbot
}
