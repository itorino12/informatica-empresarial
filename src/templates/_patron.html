<svg class="patron" viewBox="0 0 {{ red.ancho }} {{ red.alto }}" aria-hidden="true" focusable="false">
  <path d="{{ red.pais }}" fill="none" stroke="#41ADE7" stroke-width="2" stroke-linejoin="round"/>
  {% for a in red.arcos %}<path d="{{ a.d }}" fill="none" stroke="#41ADE7" stroke-width="1.5" opacity=".8"/>{% endfor %}
  {% for n in red.nodos %}<circle cx="{{ n.x }}" cy="{{ n.y }}" r="7" fill="#41ADE7"/>{% endfor %}
  <rect x="{{ red.hub.x - 7 }}" y="{{ red.hub.y - 7 }}" width="14" height="14" transform="rotate(45 {{ red.hub.x }} {{ red.hub.y }})" fill="none" stroke="#41ADE7" stroke-width="2"/>
</svg>
